name: CI/CD Pipeline

on:
  push:
    branches:
      - zeus

permissions:
  security-events: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: ✅ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Set up Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3️⃣ Install dependencies
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Install pytest & coverage
      - name: 🔧 Install pytest & coverage
        run: python -m pip install pytest pytest-cov

      # 5️⃣ Set PYTHONPATH
      - name: 🧩 Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      # 6️⃣ Run tests with coverage
      - name: 🧪 Run tests with coverage
        run: python -m pytest -v --cov=app --cov-report=xml tests/

      # 7️⃣ Install SonarQube Scanner
      - name: 📥 Install SonarQube Scanner
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.6.2.2472-linux.zip
          unzip sonar-scanner.zip -d $HOME
          echo "$HOME/sonar-scanner-4.6.2.2472-linux/bin" >> $GITHUB_PATH

      # 8️⃣ Run SonarQube analysis
      - name: 🔍 Run SonarQube analysis
        run: |
          sonar-scanner \
            -Dsonar.projectKey=MyTictac \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://35.154.73.125:9000 \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.source=. \
            -Dsonar.language=py \
            -X
