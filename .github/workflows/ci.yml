name: CI/CD Pipeline

on:
  push:
    branches:
      - zeus

permissions:
  security-events: write

jobs:
  build_and_analyze:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: ✅ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Set up Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3️⃣ Install dependencies
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Install pytest & coverage
      - name: 🔧 Install pytest & coverage
        run: python -m pip install pytest pytest-cov

      # 5️⃣ Set PYTHONPATH
      - name: 🧩 Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      # 6️⃣ Debug repo contents (optional)
      - name: 📂 List repo files
        run: ls -R

      # 7️⃣ Run tests with coverage
      - name: 🧪 Run tests with coverage
        run: python -m pytest -v --cov=app --cov-report=xml tests/

      # 8️⃣ Install SonarQube Scanner
      - name: 📥 Install SonarQube Scanner
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.7.0.2747-linux.zip
          unzip sonar-scanner.zip -d $HOME
          echo "$HOME/sonar-scanner-4.7.0.2747-linux/bin" >> $GITHUB_PATH

      # 9️⃣ Run SonarQube analysis
      - name: 🔍 Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=web-app \
            -Dsonar.sources=. \
            -Dsonar.host.url=${{ secrets.SONAR_URL }} \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.language=py \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.sourceEncoding=UTF-8 \
            -X
