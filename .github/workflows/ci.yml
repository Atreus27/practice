name: CI/CD Pipeline

permissions:
  security-events: write

on:
  push:
    branches:
      - zeus   # Only trigger on zeus branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4️⃣ Ensure pytest and coverage are installed
      - name: Ensure pytest is installed
        run: python -m pip install pytest pytest-cov

      # 5️⃣ Set PYTHONPATH
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      # 6️⃣ Run tests with coverage
      - name: Run Tests with Coverage
        run: python -m pytest -v -s --cov=app --cov-report=xml tests/

      # 7️⃣ Install SonarQube Scanner
      - name: Install SonarQube Scanner
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.7.0.2747-linux.zip
          unzip sonar-scanner.zip -d $HOME
          echo "$HOME/sonar-scanner-4.7.0.2747-linux/bin" >> $GITHUB_PATH

      # 8️⃣ Run SonarQube Analysis
      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=web-app \
            -Dsonar.sources=. \
            -Dsonar.host.url=${{ secrets.SONAR_URL }} \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.sourceEncoding=UTF-8 \
            -X

      # 9️⃣ Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t web-app:latest .

      # 🔟 Run Docker container (optional smoke test)
      - name: Run Docker Container
        run: |
          docker run -d --name web-app -p 5000:5000 web-app:latest
          sleep 5
          curl -f http://localhost:5000/ || (docker logs web-app && exit 1)
          docker stop web-app
          docker rm web-app
